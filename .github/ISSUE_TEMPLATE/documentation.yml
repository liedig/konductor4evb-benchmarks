name: Documentation
description: Report incorrect, missing, or unclear documentation
labels: ["type:docs", "status:needs-triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The repository path of the page.
      placeholder: README.md or docs/plan/design.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
      description: Quote the passage if it helps, and say what you expected to find.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: >
        Which part of the benchmark harness does this concern? Issue forms can't
        apply labels from a dropdown, so a maintainer applies the matching area
        label and a priority during triage.
      options:
        - Driver (area:driver)
        - Stack and Makefile (area:infra)
        - CI (area:ci)
        - Dependencies (area:deps)
        - Documentation (area:docs)
    validations:
      required: false
