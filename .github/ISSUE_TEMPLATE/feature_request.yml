name: Feature request
description: Suggest a new capability or an improvement
labels: ["type:feature", "status:needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like the benchmark harness to do?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: >
        Which part of the benchmark harness does this concern? Issue forms can't
        apply labels from a dropdown, so a maintainer applies the matching area
        label and a priority during triage.
      options:
        - Driver (area:driver)
        - Stack and Makefile (area:infra)
        - CI (area:ci)
        - Dependencies (area:deps)
        - Documentation (area:docs)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or considered.
    validations:
      required: false
