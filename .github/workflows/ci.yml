name: CI

on:
  # Run on PRs, and on pushes to the default branch only. A PR branch push
  # would otherwise trigger two runs for the same commit (push + pull_request)
  # in separate GitHub Actions cache scopes that can't share artifacts, so each
  # keeps missing the cache the other just saved. Pushes to main still
  # populate a branch-scoped cache that PRs inherit as their base.
  push:
    branches: [main]
  pull_request:

# Key on the head commit SHA so the push and pull_request events for the same
# commit share one group and collapse to a single run (github.ref differs
# between the two events, so a ref-based group would not dedupe them).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Read-only everywhere: PR builds must not write to the repo, and push builds
# have no write need either. Fork PRs would be downgraded to read-only anyway;
# this makes the posture explicit rather than inherited.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci

      - name: Rust tests
        run: cargo test

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Template checks
        run: uv run --with pytest --with pyyaml pytest tests

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      # Separate cache from check/test: those compile natively for x86_64, while
      # this job cross-compiles release artifacts for arm64 (provided.al2023).
      # Sharing "ci" would never hit and would thrash the cache.
      #
      # prefix-key folds a hash of Cargo.toml into the cache key: rust-cache's
      # default key reads only [package] and [*dependencies], so a
      # [profile.release] change (lto, codegen-units) would otherwise report a
      # full match yet force a full recompile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: build-arm64

      # Same install path as the platform repo's build job; cargo-lambda
      # supplies the arm64 cross-linker.
      - name: Install build tools
        run: pip install cargo-lambda

      # Same build as `make build`.
      - name: Build
        run: cargo lambda build --release --arm64
