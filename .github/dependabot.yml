version: 2
updates:
  # Rust crate. Cargo.lock is gitignored in this repo, so these are Cargo.toml
  # manifest PRs rather than lockfile diffs.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:deps"]
    groups:
      aws-sdk:
        patterns: ["aws-config", "aws-sdk-*", "aws-smithy-*"]
      rust-platform:
        patterns: ["tokio", "serde", "serde_json", "lambda_runtime", "tracing", "tracing-subscriber", "anyhow"]

  # Workflows pin actions by SHA; this is what keeps those pins current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:ci"]
